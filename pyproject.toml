[project]
name = "intersect-chess-instrument-control-service"
version = "0.1.0"
description = "INTERSECT Service for CHESS Instrument Control — receives next-point recommendations and writes motor position files for SPEC"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}

dependencies = [
    "intersect_sdk[amqp]>=0.8.0,<0.9.0",
    "pydantic>=2.0",
]

[project.scripts]
chess-instrument-control-service = "chess_instrument_control_service.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_instrument_control_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
